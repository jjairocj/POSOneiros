# CI/CD de la imagen Docker (para el despliegue en CasaOS). Ver docs/17-Despliegue-Docker-CasaOS.md
#
# En cada push a main:  tests + typecheck  ->  construye la imagen linux/amd64  ->  la sube a GHCR.
# Si los tests fallan, NO se publica imagen. También se puede lanzar a mano (Actions -> Run workflow).
name: Imagen Docker

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oneiros-pos

jobs:
  test:
    name: Tests y typecheck
    runs-on: ubuntu-latest
    env:
      # Solo para que `prisma generate` (postinstall) lea prisma.config.ts; no se conecta a nada.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  image:
    name: Construir y publicar imagen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
